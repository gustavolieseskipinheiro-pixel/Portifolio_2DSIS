<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Cards Responsivos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Usuário">

            <h4>Biografia</h4>

            <p>
                João gosta de programação e desenvolvimento web.
            </p>

        </div>

        
        <div class="card">

            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Usuário">

            <h4>Biografia</h4>

            <p>
                Maria trabalha com design e criação de interfaces.
            </p>

        </div>

        
        <div class="card">

            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Usuário">

            <h4>Biografia</h4>

            </p>

</html>
